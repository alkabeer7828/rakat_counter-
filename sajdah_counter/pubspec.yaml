name: sajdah_counter
description: Rakat Counter app with Qibla compass and prayer notifications.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  wakelock_plus: ^1.3.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  adhan: ^2.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true