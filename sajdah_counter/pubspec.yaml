name: sajdah_counter
description: Offline Sajdah & Rakat counter for Muslims using pose detection and light proximity.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  google_mlkit_pose_detection: ^0.13.0
  wakelock_plus: ^1.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true